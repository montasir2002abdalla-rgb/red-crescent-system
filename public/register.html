<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد - الهلال الأحمر</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        .role-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .role-card {
            background: rgba(255,255,255,0.7);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            width: 150px;
        }
        .role-card i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--sky-600);
        }
        .role-card.selected {
            border-color: var(--sky-600);
            background: rgba(79,195,247,0.2);
            transform: scale(1.02);
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .step-header {
            background: linear-gradient(145deg, var(--sky-500), var(--sky-700));
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            text-align: center;
        }
        .step-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--neutral-700);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--sky-500);
            outline: none;
            box-shadow: 0 0 0 3px rgba(3,169,244,0.2);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(145deg, var(--sky-500), var(--sky-700));
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(3,169,244,0.3);
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-top: 10px;
        }
        .code-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            direction: ltr;
        }
        .code-input input {
            width: 55px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid var(--sky-300);
            border-radius: 10px;
        }
        .timer {
            text-align: center;
            color: var(--warning);
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .resend-link {
            display: block;
            text-align: center;
            color: var(--sky-600);
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
        }
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .family-member {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .remove-family {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .back-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .location-hint {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .code-input input {
                width: 45px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-container">
            <div class="logo"><div class="crescent"></div></div>
            <h1>جمعية الهلال الأحمر</h1>
        </div>
    </div>

    <div class="main-container">
        <div class="form-container" style="max-width: 700px;">
            <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-right"></i> رجوع</button>

            <!-- اختيار نوع الحساب -->
            <div class="role-selector">
                <div class="role-card" data-role="employee" onclick="selectRole('employee')">
                    <i class="fas fa-user-tie"></i>
                    <h4>موظف / متطوع</h4>
                </div>
                <div class="role-card" data-role="donor" onclick="selectRole('donor')">
                    <i class="fas fa-hand-holding-heart"></i>
                    <h4>مانح</h4>
                </div>
                <div class="role-card" data-role="beneficiary" onclick="selectRole('beneficiary')">
                    <i class="fas fa-user-injured"></i>
                    <h4>مستفيد</h4>
                </div>
            </div>

            <!-- ==================== الخطوة 1: إدخال البريد الإلكتروني ==================== -->
            <div id="step1" class="step">
                <div class="step-header">
                    <h3><i class="fas fa-envelope"></i> الخطوة 1: تأكيد البريد الإلكتروني</h3>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> البريد الإلكتروني *</label>
                    <input type="email" id="emailInput" placeholder="example@email.com" required>
                    <small>سيتم إرسال رمز التحقق إلى هذا البريد</small>
                </div>
                <button class="btn btn-primary" onclick="sendVerificationCode()" id="sendCodeBtn">
                    <i class="fas fa-paper-plane"></i> إرسال رمز التحقق
                </button>
            </div>

            <!-- ==================== الخطوة 2: إدخال رمز التحقق ==================== -->
            <div id="step2" class="step">
                <div class="step-header">
                    <h3><i class="fas fa-key"></i> الخطوة 2: أدخل رمز التحقق</h3>
                </div>
                <div id="codeMessage"></div>
                <div class="code-input" id="codeInputs">
                    <input type="text" maxlength="1" class="code-digit" data-index="0">
                    <input type="text" maxlength="1" class="code-digit" data-index="1">
                    <input type="text" maxlength="1" class="code-digit" data-index="2">
                    <input type="text" maxlength="1" class="code-digit" data-index="3">
                    <input type="text" maxlength="1" class="code-digit" data-index="4">
                    <input type="text" maxlength="1" class="code-digit" data-index="5">
                </div>
                <div class="timer" id="timer">يمكنك إعادة إرسال الرمز بعد <span id="countdown">60</span> ثانية</div>
                <a class="resend-link" id="resendLink" onclick="resendCode()" style="display: none;">⟳ إعادة إرسال رمز التحقق</a>
                <button class="btn btn-primary" onclick="verifyCodeAndProceed()" id="verifyBtn">
                    <i class="fas fa-check"></i> تأكيد ومتابعة التسجيل
                </button>
            </div>

            <!-- ==================== الخطوة 3: باقي بيانات التسجيل ==================== -->
            <div id="step3" class="step">
                <div class="step-header">
                    <h3><i class="fas fa-user-plus"></i> الخطوة 3: أكمل بياناتك</h3>
                </div>
                <div id="registrationFormContainer"></div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        let selectedRole = null;
        let verifiedEmail = null;
        let statesList = [];
        let countdown = 60;
        let countdownInterval = null;

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-card').forEach(card => card.classList.remove('selected'));
            document.querySelector(`.role-card[data-role="${role}"]`).classList.add('selected');
            
            // إعادة تعيين الخطوات
            verifiedEmail = null;
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            document.getElementById('emailInput').value = '';
            document.getElementById('emailInput').disabled = false;
            document.getElementById('sendCodeBtn').disabled = false;
            document.getElementById('sendCodeBtn').innerHTML = '<i class="fas fa-paper-plane"></i> إرسال رمز التحقق';
            
            // تنظيف حقول الكود
            document.querySelectorAll('.code-digit').forEach(input => input.value = '');
        }

        // إرسال رمز التحقق
        async function sendVerificationCode() {
            const email = document.getElementById('emailInput').value;
            if (!email) {
                alert('⚠️ الرجاء إدخال البريد الإلكتروني');
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                alert('⚠️ الرجاء إدخال بريد إلكتروني صحيح');
                return;
            }

            const btn = document.getElementById('sendCodeBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> جاري الإرسال...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/send-verification-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, role: selectedRole })
                });
                const result = await response.json();

                if (response.ok) {
                    // الانتقال إلى الخطوة 2
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('codeMessage').innerHTML = `<div class="alert alert-success">✅ تم إرسال رمز التحقق إلى ${email}</div>`;
                    
                    // بدء العد التنازلي
                    startCountdown();
                } else {
                    alert('❌ ' + result.error);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('❌ حدث خطأ: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // بدء العد التنازلي لإعادة الإرسال
        function startCountdown() {
            countdown = 60;
            const timerDiv = document.getElementById('timer');
            const countdownSpan = document.getElementById('countdown');
            const resendLink = document.getElementById('resendLink');
            
            timerDiv.style.display = 'block';
            resendLink.style.display = 'none';
            
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                countdown--;
                countdownSpan.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    timerDiv.style.display = 'none';
                    resendLink.style.display = 'block';
                }
            }, 1000);
        }

        // إعادة إرسال الرمز
        async function resendCode() {
            const email = document.getElementById('emailInput').value;
            if (!email) return;
            
            const resendLink = document.getElementById('resendLink');
            resendLink.innerText = '⟳ جاري الإرسال...';
            resendLink.style.pointerEvents = 'none';
            
            try {
                const response = await fetch('/api/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, role: selectedRole })
                });
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('codeMessage').innerHTML = `<div class="alert alert-success">✅ تم إعادة إرسال رمز التحقق إلى ${email}</div>`;
                    startCountdown();
                } else {
                    alert('❌ ' + result.error);
                }
            } catch (error) {
                alert('❌ حدث خطأ: ' + error.message);
            } finally {
                resendLink.innerText = '⟳ إعادة إرسال رمز التحقق';
                resendLink.style.pointerEvents = 'auto';
            }
        }

        // التحقق من الرمز والانتقال إلى الخطوة 3
        async function verifyCodeAndProceed() {
            let code = '';
            document.querySelectorAll('.code-digit').forEach(input => {
                code += input.value;
            });
            
            if (code.length !== 6) {
                alert('⚠️ الرجاء إدخال رمز التحقق المكون من 6 أرقام');
                return;
            }
            
            const email = document.getElementById('emailInput').value;
            const verifyBtn = document.getElementById('verifyBtn');
            const originalText = verifyBtn.innerHTML;
            verifyBtn.innerHTML = '<span class="loading"></span> جاري التحقق...';
            verifyBtn.disabled = true;
            
            try {
                const response = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: code })
                });
                const result = await response.json();
                
                if (response.ok) {
                    verifiedEmail = email;
                    document.getElementById('codeMessage').innerHTML = `<div class="alert alert-success">✅ ${result.message}</div>`;
                    
                    // تحميل نموذج التسجيل حسب الدور
                    await loadRegistrationForm();
                    
                    // الانتقال إلى الخطوة 3
                    document.getElementById('step2').classList.remove('active');
                    document.getElementById('step3').classList.add('active');
                } else {
                    document.getElementById('codeMessage').innerHTML = `<div class="alert alert-danger">❌ ${result.error}</div>`;
                    verifyBtn.innerHTML = originalText;
                    verifyBtn.disabled = false;
                }
            } catch (error) {
                alert('❌ حدث خطأ: ' + error.message);
                verifyBtn.innerHTML = originalText;
                verifyBtn.disabled = false;
            }
        }

        // تحميل نموذج التسجيل حسب الدور
        async function loadRegistrationForm() {
            const container = document.getElementById('registrationFormContainer');
            
            // تحميل قائمة الولايات أولاً
            await loadStates();
            
            if (selectedRole === 'employee') {
                container.innerHTML = getEmployeeForm();
                attachEmployeeSubmit();
            } else if (selectedRole === 'donor') {
                container.innerHTML = getDonorForm();
                attachDonorSubmit();
            } else if (selectedRole === 'beneficiary') {
                container.innerHTML = getBeneficiaryForm();
                attachBeneficiarySubmit();
                await loadStatesForBen();
            }
        }

        // تحميل الولايات
        async function loadStates() {
            try {
                const res = await fetch('/api/states');
                statesList = await res.json();
            } catch(e) { console.error(e); }
        }

        async function loadStatesForBen() {
            try {
                const res = await fetch('/api/states');
                const states = await res.json();
                const select = document.getElementById('benState');
                if (select) {
                    select.innerHTML = '<option value="">اختر الولاية</option>';
                    states.forEach(s => {
                        select.innerHTML += `<option value="${s.id}">${s.name_ar}</option>`;
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function loadLocalitiesForBen() {
            const stateId = document.getElementById('benState')?.value;
            if (!stateId) return;
            try {
                const res = await fetch(`/api/localities/${stateId}`);
                const localities = await res.json();
                const select = document.getElementById('benLocality');
                select.innerHTML = '<option value="">اختر المحلية</option>';
                localities.forEach(l => {
                    select.innerHTML += `<option value="${l.id}">${l.name_ar}</option>`;
                });
            } catch(e) { console.error(e); }
        }

        async function loadWarehouses() {
            const localityId = document.getElementById('benLocality')?.value;
            if (!localityId) return;
            try {
                const res = await fetch(`/api/warehouses/${localityId}`);
                const warehouses = await res.json();
                const select = document.getElementById('benWarehouse');
                select.innerHTML = '<option value="">اختر المستودع</option>';
                warehouses.forEach(w => {
                    select.innerHTML += `<option value="${w.id}">${w.name_ar}</option>`;
                });
            } catch(e) { console.error(e); }
        }

        // نموذج الموظف
        function getEmployeeForm() {
            return `
                <form id="employeeForm">
                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> رقم الموظف * (4 أرقام)</label>
                        <input type="text" id="empEmployeeId" required pattern="[0-9]{4}" maxlength="4" placeholder="مثلاً 1234">
                        <small>يجب أن يتكون رقم الموظف من 4 أرقام</small>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم الكامل *</label>
                        <input type="text" id="empFullName" required placeholder="محمد أحمد">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الهاتف * (10 أرقام)</label>
                        <input type="tel" id="empPhone" required pattern="[0-9]{10}" placeholder="0912345678">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> الرقم الوطني (11 رقم) *</label>
                        <input type="text" id="empNationalId" required pattern="[0-9]{11}" placeholder="12345678901">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-venus-mars"></i> الجنس *</label>
                        <select id="empGender" required>
                            <option value="">اختر الجنس</option>
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                    </div>
                    <div class="location-hint">
                        <i class="fas fa-info-circle"></i> هذه المعلومات تستخدم للتحقق عند نسيان كلمة المرور
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-globe"></i> الولاية *</label>
                        <select id="empState" required onchange="loadLocalitiesForEmp()">
                            <option value="">اختر الولاية</option>
                            ${statesList.map(s => `<option value="${s.name_ar}">${s.name_ar}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-city"></i> المحلية *</label>
                        <select id="empCity" required>
                            <option value="">اختر المحلية أولاً</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> المؤهلات والخبرات</label>
                        <textarea id="empQualifications" rows="3" placeholder="المؤهلات الدراسية والخبرات..."></textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-heart"></i> الدافع للانضمام</label>
                        <textarea id="empMotivation" rows="3" placeholder="ما الذي يدفعك للانضمام؟"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> كلمة المرور *</label>
                            <input type="password" id="empPassword" required minlength="8" placeholder="********">
                            <small>8 خانات على الأقل (حروف وأرقام)</small>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> تأكيد كلمة المرور *</label>
                            <input type="password" id="empConfirmPassword" required placeholder="********">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="empAgreeTerms" required> أوافق على شروط الاستخدام
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
                </form>
            `;
        }

        // نموذج المانح (بدون ولاية/محلية)
        function getDonorForm() {
            return `
                <form id="donorForm">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم الكامل *</label>
                        <input type="text" id="donorFullName" required placeholder="محمد أحمد">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الهاتف * (10 أرقام)</label>
                        <input type="tel" id="donorPhone" required pattern="[0-9]{10}" placeholder="0912345678">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-venus-mars"></i> الجنس *</label>
                        <select id="donorGender" required>
                            <option value="">اختر الجنس</option>
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-tag"></i> نوع المانح</label>
                        <select id="donorType">
                            <option value="individual">فرد</option>
                            <option value="company">شركة/مؤسسة</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> كلمة المرور *</label>
                            <input type="password" id="donorPassword" required minlength="8" placeholder="********">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> تأكيد كلمة المرور *</label>
                            <input type="password" id="donorConfirmPassword" required placeholder="********">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="donorAgreeTerms" required> أوافق على شروط الاستخدام
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
                    <p class="note" style="margin-top: 15px;">ملاحظة: سيتم إنشاء رقم مانح تلقائي بعد التسجيل</p>
                </form>
            `;
        }

        // نموذج المستفيد
        function getBeneficiaryForm() {
            return `
                <form id="beneficiaryForm">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم الكامل *</label>
                        <input type="text" id="benFullName" required placeholder="محمد أحمد">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الهاتف * (10 أرقام)</label>
                        <input type="tel" id="benPhone" required pattern="[0-9]{10}" placeholder="0912345678">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> الرقم الوطني * (11 رقم)</label>
                        <input type="text" id="benNationalId" required pattern="[0-9]{11}" placeholder="12345678901">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-venus-mars"></i> الجنس *</label>
                        <select id="benGender" required>
                            <option value="">اختر الجنس</option>
                            <option value="male">ذكر</option>
                            <option value="female">أنثى</option>
                        </select>
                    </div>
                    <div class="location-hint">
                        <i class="fas fa-info-circle"></i> هذه المعلومات تحدد المستودع المناسب لك
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-globe"></i> الولاية *</label>
                        <select id="benState" required onchange="loadLocalitiesForBen()">
                            <option value="">اختر الولاية</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-city"></i> المحلية *</label>
                        <select id="benLocality" required onchange="loadWarehouses()">
                            <option value="">اختر المحلية أولاً</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-warehouse"></i> المستودع *</label>
                        <select id="benWarehouse" required>
                            <option value="">اختر المستودع</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-heartbeat"></i> الحالة الصحية</label>
                        <input type="text" id="benHealthStatus" placeholder="جيد - يحتاج رعاية - ...">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-users"></i> عدد أفراد الأسرة</label>
                        <input type="number" id="benFamilySize" min="0" max="20" value="0" onchange="generateFamilyFields()">
                    </div>
                    <div id="dynamicFamilyContainer"></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> كلمة المرور *</label>
                            <input type="password" id="benPassword" required minlength="8" placeholder="********">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> تأكيد كلمة المرور *</label>
                            <input type="password" id="benConfirmPassword" required placeholder="********">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="benAgreeTerms" required> أوافق على شروط الاستخدام
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
                </form>
            `;
        }

        // دوال مساعدة
        async function loadLocalitiesForEmp() {
            const stateName = document.getElementById('empState')?.value;
            const state = statesList.find(s => s.name_ar === stateName);
            if (state) {
                try {
                    const res = await fetch(`/api/localities/${state.id}`);
                    const localities = await res.json();
                    const select = document.getElementById('empCity');
                    select.innerHTML = '<option value="">اختر المحلية</option>';
                    localities.forEach(l => {
                        select.innerHTML += `<option value="${l.name_ar}">${l.name_ar}</option>`;
                    });
                } catch(e) { console.error(e); }
            }
        }

        function generateFamilyFields() {
            const count = parseInt(document.getElementById('benFamilySize')?.value) || 0;
            const container = document.getElementById('dynamicFamilyContainer');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="family-member">
                        <h4>فرد الأسرة ${i}</h4>
                        <div class="form-group"><label>الاسم</label><input type="text" class="fam-name" required></div>
                        <div class="form-group"><label>الرقم الوطني</label><input type="text" class="fam-nid" pattern="[0-9]{11}"></div>
                        <div class="form-group"><label>الحالة الصحية</label><input type="text" class="fam-health"></div>
                        <button type="button" class="remove-family" onclick="this.parentElement.remove()">إزالة</button>
                    </div>`;
            }
        }

        // إرسال بيانات الموظف
        function attachEmployeeSubmit() {
            const form = document.getElementById('employeeForm');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('empPassword').value;
                const confirm = document.getElementById('empConfirmPassword').value;
                if (password !== confirm) { alert('كلمتا المرور غير متطابقتين'); return; }
                
                const data = {
                    employeeId: document.getElementById('empEmployeeId').value,
                    name: document.getElementById('empFullName').value,
                    email: verifiedEmail,
                    phone: document.getElementById('empPhone').value,
                    nationalId: document.getElementById('empNationalId').value,
                    password: password,
                    role: 'volunteer',
                    qualifications: document.getElementById('empQualifications').value,
                    motivation: document.getElementById('empMotivation').value,
                    gender: document.getElementById('empGender').value,
                    state: document.getElementById('empState').value,
                    city: document.getElementById('empCity').value
                };
                
                try {
                    const result = await register(data);
                    if (result.message) {
                        alert('✅ تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                        window.location.href = 'index.html';
                    } else {
                        alert(result.message || 'تم إنشاء الحساب بنجاح');
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    alert('❌ خطأ: ' + error.message);
                }
            });
        }

        // إرسال بيانات المانح
        function attachDonorSubmit() {
            const form = document.getElementById('donorForm');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('donorPassword').value;
                const confirm = document.getElementById('donorConfirmPassword').value;
                if (password !== confirm) { alert('كلمتا المرور غير متطابقتين'); return; }
                
                const data = {
                    employeeId: '',
                    name: document.getElementById('donorFullName').value,
                    email: verifiedEmail,
                    phone: document.getElementById('donorPhone').value,
                    password: password,
                    role: 'donor',
                    donorType: document.getElementById('donorType').value,
                    gender: document.getElementById('donorGender').value
                };
                
                try {
                    const result = await register(data);
                    if (result.message) {
                        alert('✅ تم إنشاء الحساب بنجاح! رقم المانح: ' + (result.employeeId || 'تم إنشاؤه'));
                        window.location.href = 'index.html';
                    } else {
                        alert(result.message || 'تم إنشاء الحساب بنجاح');
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    alert('❌ خطأ: ' + error.message);
                }
            });
        }

        // إرسال بيانات المستفيد
        function attachBeneficiarySubmit() {
            const form = document.getElementById('beneficiaryForm');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('benPassword').value;
                const confirm = document.getElementById('benConfirmPassword').value;
                if (password !== confirm) { alert('كلمتا المرور غير متطابقتين'); return; }
                
                const familyMembers = [];
                document.querySelectorAll('#dynamicFamilyContainer .family-member').forEach(div => {
                    const name = div.querySelector('.fam-name')?.value;
                    const nationalId = div.querySelector('.fam-nid')?.value;
                    const health = div.querySelector('.fam-health')?.value;
                    if (name) familyMembers.push({ name, nationalId: nationalId || '', healthStatus: health || '' });
                });
                
                const stateSelect = document.getElementById('benState');
                const localitySelect = document.getElementById('benLocality');
                const stateName = stateSelect.options[stateSelect.selectedIndex]?.text || '';
                const cityName = localitySelect.options[localitySelect.selectedIndex]?.text || '';
                
                const data = {
                    employeeId: '',
                    name: document.getElementById('benFullName').value,
                    email: verifiedEmail,
                    phone: document.getElementById('benPhone').value,
                    password: password,
                    role: 'beneficiary',
                    gender: document.getElementById('benGender').value,
                    nationalId: document.getElementById('benNationalId').value,
                    healthStatus: document.getElementById('benHealthStatus').value,
                    familySize: parseInt(document.getElementById('benFamilySize').value) || 0,
                    familyMembersJSON: JSON.stringify(familyMembers),
                    state: stateName,
                    city: cityName,
                    area: '',
                    warehouse_id: document.getElementById('benWarehouse').value
                };
                
                try {
                    const result = await register(data);
                    if (result.message) {
                        alert('✅ تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
                        window.location.href = 'index.html';
                    } else {
                        alert(result.message || 'تم إنشاء الحساب بنجاح');
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    alert('❌ خطأ: ' + error.message);
                }
            });
        }
        
        // عرض الخطوة 1 افتراضياً
        document.getElementById('step1').classList.add('active');
        
        // ربط الدوال العامة
        window.selectRole = selectRole;
        window.sendVerificationCode = sendVerificationCode;
        window.resendCode = resendCode;
        window.verifyCodeAndProceed = verifyCodeAndProceed;
        window.loadLocalitiesForEmp = loadLocalitiesForEmp;
        window.loadLocalitiesForBen = loadLocalitiesForBen;
        window.loadWarehouses = loadWarehouses;
        window.generateFamilyFields = generateFamilyFields;
    </script>
</body>
</html>
