<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات المساعدة العينية - الهلال الأحمر</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
            <div class="logo-small"><div class="crescent"></div></div>
            <h2>طلبات المساعدة العينية (قيد المراجعة)</h2>
        </div>
        <div class="header-right"><span id="userName">...</span></div>
    </header>
    <div class="container" style="margin-top:80px;">
        <div class="section-content">
            <div class="alert alert-info"><i class="fas fa-info-circle"></i> الطلبات العينية المعلقة بانتظار موافقتك.</div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead><tr><th>المستفيد</th><th>النوع</th><th>الوصف</th><th>رقم الطلب</th><th>عدد أفراد الأسرة</th><th>التاريخ</th><th>الكمية المقترحة</th><th>إجراءات</th></tr></thead>
                    <tbody id="pendingRequestsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        const user = requireAuth(['employee', 'volunteer']);
        updateUserDisplay();
        initFloatingBell();

        async function loadPending() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/assistance-requests/pending', { headers: { 'Authorization': `Bearer ${token}` } });
                const requests = await res.json();
                document.getElementById('pendingRequestsBody').innerHTML = requests.map(r => `
                    <tr>
                        <td>${r.beneficiaryName || ''}</td>
                        <td>${r.requestType}</td>
                        <td>${r.description}</td>
                        <td>${r.request_number || '—'}</td>
                        <td>${r.familyMembers || 1}</td>
                        <td>${new Date(r.createdAt).toLocaleDateString('ar-EG')}</td>
                        <td><input type="number" id="qty_${r.id}" value="1" min="1" style="width:80px;"></td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="approve(${r.id})">موافقة</button>
                            <button class="btn btn-danger btn-sm" onclick="reject(${r.id})">رفض</button>
                        </td>
                    </tr>
                `).join('');
            } catch(e) { alert(e.message); }
        }

        window.approve = async (id) => {
            const qty = parseInt(document.getElementById('qty_'+id)?.value || 1);
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`/api/assistance-requests/${id}/approve`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ quantity: qty })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('تمت الموافقة وإرسال إشعار قابل للطباعة');
                loadPending();
            } catch(e) { alert(e.message); }
        };

        window.reject = async (id) => {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`/api/assistance-requests/${id}/reject`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('تم الرفض');
                loadPending();
            } catch(e) { alert(e.message); }
        };

        loadPending();
    </script>
</body>
</html>
