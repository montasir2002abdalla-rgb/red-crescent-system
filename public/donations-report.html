<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير التبرعات - الهلال الأحمر</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="report-page">
    <header class="dashboard-header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
            <div class="logo-small"><div class="crescent"></div></div>
            <h2>تقرير التبرعات</h2>
        </div>
        <div class="header-center"></div>
        <div class="header-right">
            <span id="userName">...</span>
        </div>
    </header>

    <div class="container" style="margin-top: 40px;">
        <div class="section-content">
            <div class="report-filters">
                <input type="text" id="searchDonations" placeholder="بحث باسم المتبرع أو الصنف...">
                <select id="filterType">
                    <option value="all">جميع التبرعات</option>
                    <option value="financial">مالية</option>
                    <option value="inkind">عينية</option>
                </select>
                <button class="btn btn-primary" onclick="printReport()">طباعة</button>
            </div>
            <div style="overflow-x: auto;">
                <table class="data-table" id="donationsReportTable">
                    <thead>
                        <tr>
                            <th>النوع</th>
                            <th>المتبرع</th>
                            <th>المبلغ / الكمية</th>
                            <th>التفاصيل</th>
                            <th>الحالة</th>
                            <th>التاريخ</th>
                        </thead>
                    <tbody id="donationsReportBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        const user = requireAuth(['manager', 'inventory_keeper']);
        updateUserDisplay();
        initFloatingBell();

        let allDonations = []; // سيحتوي على التبرعات المالية والعينية معاً

        async function loadDonationsReport() {
            try {
                // جلب التبرعات المالية
                const financialRes = await fetch('/api/donations', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const financialData = await financialRes.json();
                const financialDonations = financialData.map(d => ({
                    type: 'financial',
                    donorName: d.donorName,
                    amount: d.amount,
                    paymentMethod: d.paymentMethod,
                    transactionId: d.transactionId,
                    status: d.status,
                    createdAt: d.createdAt,
                    details: `${d.paymentMethod} - ${d.transactionId || 'لا يوجد رقم عملية'}`
                }));

                // جلب التبرعات العينية (من جدول inkind_donations)
                const inkindRes = await fetch('/api/inkind-donations', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                let inkindDonations = [];
                if (inkindRes.ok) {
                    const inkindData = await inkindRes.json();
                    inkindDonations = inkindData.map(d => ({
                        type: 'inkind',
                        donorName: d.donorName,
                        amount: `${d.quantity} ${d.unit}`,
                        itemName: d.itemName,
                        category: d.category,
                        description: d.description,
                        status: d.status,
                        createdAt: d.createdAt,
                        details: `الصنف: ${d.itemName} (${d.category}) - ${d.description || ''}`
                    }));
                } else {
                    // إذا لم يكن المسار موجوداً، نحاول جلبها من API العام
                    try {
                        const allRes = await fetch('/api/donations', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                        });
                        const allData = await allRes.json();
                        // التبرعات العينية تأتي مع donationType === 'inkind'
                        inkindDonations = allData.filter(d => d.donationType === 'inkind').map(d => ({
                            type: 'inkind',
                            donorName: d.donorName,
                            amount: `${d.amount} ${d.paymentMethod}`,
                            itemName: d.transactionId,
                            status: d.status,
                            createdAt: d.createdAt,
                            details: d.description || ''
                        }));
                    } catch(e) { console.warn('لا يمكن جلب التبرعات العينية', e); }
                }

                // دمج القائمتين وفرز حسب التاريخ
                allDonations = [...financialDonations, ...inkindDonations];
                allDonations.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderTable(allDonations);
            } catch (error) {
                alert(error.message);
            }
        }

        function renderTable(donations) {
            const tbody = document.getElementById('donationsReportBody');
            tbody.innerHTML = donations.map(d => {
                let typeText = d.type === 'financial' ? '💰 مالي' : '📦 عيني';
                let amountText = d.type === 'financial' ? `${d.amount} جنيه` : d.amount;
                let detailsText = d.type === 'financial' ? d.details : d.details;
                return `
                    <tr>
                        <td data-label="النوع">${typeText}</td>
                        <td data-label="المتبرع">${d.donorName || '-'}</td>
                        <td data-label="المبلغ/الكمية">${amountText}</td>
                        <td data-label="التفاصيل">${detailsText}</td>
                        <td data-label="الحالة"><span class="status ${d.status}">${d.status === 'pending' ? 'معلقة' : 'مكتملة'}</span></td>
                        <td data-label="التاريخ">${new Date(d.createdAt).toLocaleDateString('ar-EG')}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterDonations() {
            const search = document.getElementById('searchDonations').value.toLowerCase();
            const typeFilter = document.getElementById('filterType').value;
            const filtered = allDonations.filter(d => {
                const matchesSearch = search === '' || (d.donorName && d.donorName.toLowerCase().includes(search)) || (d.itemName && d.itemName.toLowerCase().includes(search));
                const matchesType = typeFilter === 'all' || d.type === typeFilter;
                return matchesSearch && matchesType;
            });
            renderTable(filtered);
        }

        document.getElementById('searchDonations').addEventListener('input', filterDonations);
        document.getElementById('filterType').addEventListener('change', filterDonations);

        function printReport() {
            window.print();
        }

        loadDonationsReport();
    </script>
</body>
</html>
